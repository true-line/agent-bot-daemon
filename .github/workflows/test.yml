name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # No external actions: checkout is plain git, and the runner's preinstalled Node runs the tests.
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git fetch -q --no-tags --depth 1 origin "+${REF}:refs/ci/head"
          git checkout -q --detach refs/ci/head
      # A software TPM for the TPM signer helper's tests (tests/tpm2-signer.test.mjs).
      - name: software TPM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends swtpm tpm2-tools
          sudo apt-get install -y -q --no-install-recommends libtss2-tcti-swtpm0t64 || sudo apt-get install -y -q --no-install-recommends libtss2-tcti-swtpm0
      # Two harness accounts, each with a 0700 home, and their broker endpoint
      # directories, laid out as the provisioner would (hq/harness-accounts.mjs), for
      # tests/hq-harness-accounts-real.test.mjs (T01) and tests/hq-launch-real.test.mjs (T02).
      # HQ starts agents through sudo (hq/launch.mjs). The job's account already
      # has passwordless sudo on GitHub runners, so no rule granting it is
      # installed here. The drop-in carries only the environment lines of the
      # rule agent-bot-machine writes, so sudo's env_reset keeps exactly the
      # variables a launch passes, as it will on a provisioned host.
      - name: harness accounts
        run: |
          for a in hqm-a hqm-b; do
            sudo useradd --system --user-group --create-home --home-dir "/home/$a" --shell /usr/sbin/nologin "$a"
            sudo chmod 0700 "/home/$a"
          done
          me="$(id -un)"
          printf 'Defaults:%s env_reset, !setenv\nDefaults:%s env_keep = "AGENT_BOT_SOULS_SOCKET AGENT_BOT_SOULS_MEMBER_TOKEN AGENT_BOT_SOULS_MEMBER_ID AGENT_BOT_SOULS_ROLE AGENT_BOT_SOULS_BROKER"\n' "$me" "$me" > /tmp/hq-launch.sudoers
          sudo visudo -cf /tmp/hq-launch.sudoers
          sudo install -m 0440 -o root -g root /tmp/hq-launch.sudoers /etc/sudoers.d/zz-hq-launch
          sudo -n -u hqm-a -- /bin/true
          ls -ld /home/hqm-a /home/hqm-b
          sudo mkdir -p /run/agent-bot-hq-test/members
          sudo chown "$(id -u)" /run/agent-bot-hq-test /run/agent-bot-hq-test/members
          sudo chmod 0755 /run/agent-bot-hq-test /run/agent-bot-hq-test/members
          for a in hqm-a hqm-b; do
            sudo mkdir "/run/agent-bot-hq-test/members/$a"
            sudo chown "$(id -u):$a" "/run/agent-bot-hq-test/members/$a"
            sudo chmod 2750 "/run/agent-bot-hq-test/members/$a"
          done
          ls -ln /run/agent-bot-hq-test/members
      - name: test
        env:
          HQ_REQUIRE_TPM: '1'
          HQ_REQUIRE_HARNESS_ACCOUNTS: '1'
          HQ_HARNESS_DIR: /run/agent-bot-hq-test/members
          HQ_HARNESS_ACCOUNTS: hqm-a,hqm-b
        run: |
          node --version
          npm test
      # The same TPM tests against a TPM that already exists and keeps its state
      # (HQ_TPM_TCTI), as a real TPM on a host does. Here it is a software TPM
      # holding a key at HQ's default handle and a leftover test key. The tests
      # run twice: they clear their own handles and leave HQ's key alone.
      - name: test (existing TPM)
        env:
          HQ_REQUIRE_TPM: '1'
          HQ_TPM_TCTI: swtpm:host=127.0.0.1,port=2321
        run: |
          state="$(mktemp -d)"
          swtpm socket --tpm2 --tpmstate "dir=$state" --server type=tcp,port=2321 --ctrl type=tcp,port=2322 --flags not-need-init,startup-clear --daemon
          export TPM2TOOLS_TCTI="$HQ_TPM_TCTI"
          for i in $(seq 50); do tpm2_getcap handles-persistent >/dev/null 2>&1 && break; sleep 0.1; done
          echo '{}' | node helpers/tpm2-signer.mjs create > "$state/hq-key.json"
          echo '{}' | node helpers/tpm2-signer.mjs --handle 0x81010021 create > /dev/null
          for run in 1 2; do node --test --test-concurrency=1 tests/tpm2-signer.test.mjs; done
          echo '{}' | node helpers/tpm2-signer.mjs status > "$state/hq-key-after.json"
          node -e 'const k = (f) => JSON.stringify(JSON.parse(require("node:fs").readFileSync(f, "utf8")).jwk); if (!k(process.argv[1]) || k(process.argv[1]) !== k(process.argv[2])) { console.error("the key at the default handle changed"); process.exit(1); }' "$state/hq-key.json" "$state/hq-key-after.json"
          left="$(tpm2_getcap handles-persistent | tr -d ' \n-')"
          test "$left" = "0x81010020" || { echo "handles left behind: $left"; exit 1; }
