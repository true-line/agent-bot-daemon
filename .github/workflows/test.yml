name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # No external actions: checkout is plain git, and the runner's preinstalled Node runs the tests.
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git fetch -q --no-tags --depth 1 origin "+${REF}:refs/ci/head"
          git checkout -q --detach refs/ci/head
      # A software TPM for the TPM signer helper's tests (tests/tpm2-signer.test.mjs).
      - name: software TPM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends swtpm tpm2-tools
          sudo apt-get install -y -q --no-install-recommends libtss2-tcti-swtpm0t64 || sudo apt-get install -y -q --no-install-recommends libtss2-tcti-swtpm0
      - name: test
        env:
          HQ_REQUIRE_TPM: '1'
        run: |
          node --version
          npm test
